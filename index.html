<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;overscroll-behavior-y:contain;scrollbar-gutter:stable;}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;color:#1e293b;background:#ffffff;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;padding-top:64px;scrollbar-gutter:stable;overflow-anchor:auto;-webkit-tap-highlight-color:transparent;}
img,svg{display:block;max-width:100%;}
button,input,textarea,select{font-family:inherit;}
button{cursor:pointer;background:none;border:none;}
a{text-decoration:none;color:inherit;}
ul{list-style:none;}
:focus-visible{outline:2.5px solid #f59e0b;outline-offset:2px;border-radius:4px;}
::selection{background:var(--amber-light);color:var(--slate-900);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--slate-50);}
::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:8px;border:2px solid var(--slate-50);}
::-webkit-scrollbar-thumb:hover{background:var(--slate-400);}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

:root{--amber:#f59e0b;--amber-dark:#d97706;--amber-light:#fef3c7;--slate-900:#0f172a;--slate-800:#1e293b;--slate-700:#334155;--slate-600:#475569;--slate-500:#64748b;--slate-400:#94a3b8;--slate-300:#cbd5e1;--slate-200:#e2e8f0;--slate-100:#f1f5f9;--slate-50:#f8fafc;--success:#22c55e;--success-light:#dcfce7;--success-dark:#16a34a;--danger:#ef4444;--danger-dark:#dc2626;--danger-light:#fef2f2;--blue-light:#dbeafe;--blue-dark:#1d4ed8;--indigo-light:#e0e7ff;--indigo-dark:#4338ca;--white:#ffffff;--r-sm:10px;--r-md:14px;--r-lg:16px;--r-xl:20px;--r-2xl:24px;--shadow-sm:0 2px 8px rgba(15,23,42,.06);--shadow-md:0 8px 24px rgba(15,23,42,.10);--shadow-lg:0 20px 44px rgba(15,23,42,.14);--shadow-xl:0 30px 70px rgba(15,23,42,.28);--shadow-amber:0 10px 26px rgba(245,158,11,.38);--ease:cubic-bezier(.4,0,.2,1);--pop:cubic-bezier(.34,1.56,.64,1);--font-display:Georgia,"Times New Roman",serif;}
.container{max-width:1360px;margin:0 auto;padding:0 24px;}
.section{padding:96px 0;content-visibility:auto;contain-intrinsic-size:auto 700px;}
.section-header{text-align:center;max-width:620px;margin:0 auto 48px;}
.eyebrow{display:inline-block;color:var(--amber);font-weight:700;text-transform:uppercase;font-size:12.5px;letter-spacing:.22em;margin-bottom:14px;}
.eyebrow::before,.eyebrow::after{content:'';display:inline-block;width:30px;height:1px;background:var(--amber);vertical-align:middle;opacity:.55;margin:0 14px;}
.section-header h2{font-family:var(--font-display);font-size:clamp(1.9rem,3.6vw,2.75rem);font-weight:700;color:var(--slate-900);margin-bottom:14px;letter-spacing:-.01em;line-height:1.15;}
.section-header p{color:var(--slate-500);font-size:16px;line-height:1.65;}
.bg-tint{background:var(--slate-50);}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 700ms var(--ease),transform 700ms var(--ease);}
.reveal.in-view{opacity:1;transform:translateY(0);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 30px;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer;transition:all 200ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;letter-spacing:.01em;}
.btn::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.25),transparent 70%);opacity:0;transition:opacity 300ms;}
.btn:hover::after{opacity:1;}
.btn:active{transform:scale(.97)!important;}
.btn-primary{background:var(--amber);color:#0f172a;box-shadow:0 8px 20px rgba(245,158,11,.3);}
.btn-primary:hover{background:var(--amber-dark);transform:translateY(-2px);box-shadow:0 14px 28px rgba(245,158,11,.38);}
.btn-primary:active{transform:translateY(-1px);}
.btn-outline-white{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.55);color:#ffffff;}
.btn-outline-white:hover{background:rgba(255,255,255,.18);border-color:#ffffff;transform:translateY(-3px);}
.btn-dark{background:var(--slate-900);color:#ffffff;}
.btn-dark:hover{background:var(--amber);color:#0f172a;transform:translateY(-2px);}
.btn-block{width:100%;}
.btn-sm{padding:10px 18px;font-size:13.5px;border-radius:var(--r-sm);}
.btn-xs{padding:6px 14px;font-size:12px;border-radius:8px;}
.btn-outline{border:1.5px solid var(--slate-200);color:var(--slate-700);}
.btn-outline:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-light);}
.btn-secondary{background:var(--slate-100);color:var(--slate-700);}
.btn-secondary:hover{background:var(--slate-200);transform:translateY(-2px);}
.btn-danger{background:var(--danger);color:#ffffff;}
.btn-danger:hover{background:var(--danger-dark);}
.search-input{width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--slate-200);background:var(--slate-50);font-size:14px;color:var(--slate-900);transition:all 200ms var(--ease);}
.search-input:focus{outline:none;border-color:var(--amber);background:#ffffff;box-shadow:0 0 0 4px rgba(245,158,11,.1);}
select.search-input{appearance:auto;background:#ffffff;cursor:pointer;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--slate-100);}
.modal-header h3{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--slate-900);display:flex;align-items:center;gap:8px;}
.cart-icon{font-size:20px;}

.navbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:1000;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(226,232,240,.9);transition:box-shadow 200ms var(--ease),background 200ms var(--ease);}
.navbar.scrolled{box-shadow:0 4px 24px rgba(15,23,42,.08);background:rgba(255,255,255,.88);}
.nav-container{max-width:1360px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px;}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--amber),var(--amber-dark));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(245,158,11,.4);color:#0f172a;flex-shrink:0;}
.logo-text{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--slate-900);letter-spacing:-.01em;}
.logo-text .accent{color:var(--amber);font-style:italic;}
.nav-links{display:flex;align-items:center;gap:8px;}
.nav-link{padding:9px 16px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--slate-600);transition:all 200ms var(--ease);}
.nav-link:hover{color:var(--amber);background:var(--amber-light);}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid transparent;color:var(--slate-700);transition:all 200ms var(--ease);position:relative;flex-shrink:0;}
.icon-btn:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-light);}
.cart-badge{position:absolute;top:-2px;right:-2px;background:var(--amber);color:#0f172a;font-size:10px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 2px 8px rgba(245,158,11,.55);}
.avatar-initials{width:24px;height:24px;border-radius:50%;background:var(--amber);color:#0f172a;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;}
.btn-signin{border:1.5px solid var(--slate-200);color:var(--slate-800);}
.btn-signin:hover{border-color:var(--amber);color:var(--amber-dark);background:var(--amber-light);transform:none;box-shadow:none;}
.btn-signin.signed-in{border-color:var(--amber);background:linear-gradient(135deg,#fff8ec,#fffdf6);box-shadow:0 2px 10px rgba(245,158,11,.18),inset 0 0 0 1px rgba(245,158,11,.18);display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;border-radius:999px;}
.btn-signin.signed-in:hover{background:linear-gradient(135deg,var(--amber-light),#fff3d9);transform:none;}
.nav-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--amber-dark));color:#0f172a;font-weight:900;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:0;}
.btn-vendor-dash{background:var(--slate-800);color:#ffffff;display:none;}
.btn-vendor-dash:hover{background:var(--amber);color:#0f172a;transform:translateY(-2px);}

.hero{position:relative;min-height:640px;height:85vh;display:flex;align-items:center;overflow:hidden;background:linear-gradient(160deg,#0f172a 0%,#1e293b 70%);}
.hero-pattern{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(120deg,rgba(15,23,42,.85) 0%,rgba(15,23,42,.60) 55%,rgba(245,158,11,.15) 100%);}
.hero-content{position:relative;z-index:2;max-width:1360px;margin:0 auto;padding:0 24px;width:100%;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fef3c7;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.14em;padding:8px 18px;border-radius:999px;margin-bottom:24px;backdrop-filter:blur(10px);}
.hero-content h1{font-family:var(--font-display);font-size:clamp(2.5rem,5.4vw,4.4rem);font-weight:700;color:#ffffff;line-height:1.1;letter-spacing:-.015em;margin-bottom:22px;max-width:820px;}
.hero-content h1 .amber{color:var(--amber);font-style:italic;}
.hero-subtitle{font-size:18px;color:rgba(255,255,255,.82);max-width:560px;margin-bottom:34px;line-height:1.65;}
.hero-search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.28);border-radius:var(--r-lg);padding:7px 7px 7px 22px;max-width:560px;margin-bottom:30px;transition:border-color 200ms var(--ease);}
.hero-search:focus-within{border-color:rgba(245,158,11,.7);}
.hero-search input{flex:1;background:transparent;border:none;outline:none;color:#ffffff;font-size:15.5px;min-width:0;}
.hero-search input::placeholder{color:rgba(255,255,255,.65);}
.hero-search-btn{width:44px;height:44px;border-radius:12px;background:var(--amber);color:#0f172a;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 200ms var(--ease);}
.hero-search-btn:hover{background:var(--amber-dark);}
.hero-buttons{display:flex;gap:16px;flex-wrap:wrap;}
.wave-divider{position:absolute;bottom:-1px;left:0;width:100%;z-index:3;line-height:0;}
.wave-divider svg{width:100%;height:70px;display:block;}

.categories-section{padding:36px 0;}
.categories-scroll{display:flex;gap:12px;overflow-x:auto;padding:4px 24px 12px;scrollbar-width:none;max-width:1360px;margin:0 auto;}
.categories-scroll::-webkit-scrollbar{display:none;}
.category-chip{flex-shrink:0;padding:11px 24px;border-radius:999px;background:#ffffff;color:var(--slate-600);font-weight:700;font-size:14px;border:1.5px solid var(--slate-200);transition:all 200ms var(--ease);white-space:nowrap;}
.category-chip:hover{border-color:var(--amber);color:var(--amber-dark);}
.category-chip.active{background:var(--amber);color:#0f172a;border-color:var(--amber);transform:scale(1.06);box-shadow:var(--shadow-amber);}

.section-header-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;max-width:1360px;margin:0 auto 36px;padding:0 24px;flex-wrap:wrap;}
.section-header-row h2{font-family:var(--font-display);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;color:var(--slate-900);letter-spacing:-.01em;}
.section-header-row p{color:var(--slate-500);font-size:15px;margin-top:6px;}
.slider-arrows{display:flex;gap:10px;}
.slider-arrow{width:44px;height:44px;border-radius:50%;background:#ffffff;border:1.5px solid var(--slate-200);color:var(--slate-700);display:flex;align-items:center;justify-content:center;transition:all 200ms var(--ease);}
.slider-arrow:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-light);}
.results-bar{display:flex;align-items:center;gap:14px;max-width:1360px;margin:-14px auto 28px;padding:0 24px;flex-wrap:wrap;}
.results-count{color:var(--slate-500);font-size:14px;font-weight:700;}
.toolbar-row{display:flex;align-items:center;gap:12px;max-width:1360px;margin:-14px auto 28px;padding:0 24px;flex-wrap:wrap;justify-content:space-between;}
.toolbar-left{display:flex;align-items:center;gap:14px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;}
.toolbar-right{display:flex;align-items:center;gap:10px;}
.sort-select{padding:9px 14px;border-radius:10px;border:1.5px solid var(--slate-200);background:#ffffff;font-size:13px;font-weight:700;color:var(--slate-700);cursor:pointer;transition:border-color 200ms var(--ease);}
.sort-select:focus{outline:none;border-color:var(--amber);}
.clear-search{display:none;align-items:center;gap:6px;background:var(--amber-light);color:var(--amber-dark);font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;}
.clear-search.show{display:inline-flex;}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px;max-width:1360px;margin:0 auto;padding:0 24px;}
.sk-card{height:330px;border-radius:var(--r-xl);background:linear-gradient(100deg,var(--slate-100) 40%,#eef2f7 50%,var(--slate-100) 60%);background-size:220% 100%;animation:skShimmer 1.3s linear infinite;}
@keyframes skShimmer{from{background-position:120% 0}to{background-position:-120% 0}}
@media(max-width:600px){.sk-card{height:290px;}}
.products-grid .product-card{animation:gridFadeIn 300ms var(--ease) both;}
.products-grid .product-card:nth-child(1){animation-delay:0ms}
.products-grid .product-card:nth-child(2){animation-delay:24ms}
.products-grid .product-card:nth-child(3){animation-delay:48ms}
.products-grid .product-card:nth-child(4){animation-delay:72ms}
.products-grid .product-card:nth-child(5){animation-delay:96ms}
.products-grid .product-card:nth-child(6){animation-delay:120ms}
.products-grid .product-card:nth-child(7){animation-delay:144ms}
.products-grid .product-card:nth-child(8){animation-delay:168ms}
.products-grid.rendered .product-card{animation:none;}
@keyframes gridFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.product-card{background:#ffffff;border-radius:var(--r-xl);overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.05);transition:transform 300ms var(--ease),box-shadow 300ms var(--ease),border-color 200ms var(--ease);cursor:pointer;display:flex;flex-direction:column;position:relative;border:1px solid rgba(226,232,240,.85);}
.product-card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(15,23,42,.12);border-color:rgba(245,158,11,.5);}
.product-card.out-of-stock{opacity:.65;pointer-events:none;}
.product-card.out-of-stock .view-btn{background:var(--slate-400);}
.product-badge{position:absolute;top:14px;left:14px;background:var(--slate-900);color:#ffffff;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;padding:5px 11px;border-radius:999px;z-index:2;}
.product-image{height:160px;background:linear-gradient(150deg,var(--slate-50),var(--slate-100));display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.product-image .stock-chip{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:900;padding:4px 10px;border-radius:999px;letter-spacing:.03em;z-index:2;}
.stock-chip.low{background:var(--danger-light);color:var(--danger);}
.stock-chip.mid{background:var(--amber-light);color:var(--amber-dark);}
.stock-chip.high{background:var(--success-light);color:var(--success);}
.product-image img{width:100%;height:100%;object-fit:cover;transition:transform 400ms var(--ease);}
.product-card:hover .product-image img{transform:scale(1.08);}
.product-icon{color:var(--amber);transition:transform 400ms var(--ease);}
.product-card:hover .product-icon{transform:scale(1.14) rotate(-3deg);}
.product-info{padding:18px 20px 22px;flex:1;display:flex;flex-direction:column;}
.vendor-name{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--amber-dark);letter-spacing:.06em;}
.product-title{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--slate-900);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;margin:7px 0 8px;line-height:1.32;transition:color 200ms var(--ease);}
.product-card:hover .product-title{color:var(--amber-dark);}
.rating-row{display:flex;align-items:center;gap:5px;color:var(--amber);font-size:13px;font-weight:700;margin-bottom:10px;}
.rating-row .reviews{color:var(--slate-400);font-weight:600;}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.price{font-size:21px;font-weight:900;color:var(--amber-dark);}
.price .unit{font-size:12.5px;font-weight:600;color:var(--slate-400);margin-left:2px;}
.quick-add-btn{width:36px;height:36px;border-radius:50%;background:var(--amber);color:#0f172a;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 200ms var(--ease);}
.quick-add-btn:hover{background:var(--amber-dark);transform:scale(1.1);}
.view-btn{margin-top:14px;width:100%;padding:11px;border-radius:12px;background:var(--amber);color:#0f172a;font-weight:900;font-size:14px;transition:all 200ms var(--ease);}
.view-btn:hover{background:var(--amber-dark);}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--slate-500);}
.empty-state svg{margin:0 auto 16px;color:var(--slate-300);}
.products-slider{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 24px 20px;max-width:1360px;margin:0 auto;scrollbar-width:none;}
.products-slider::-webkit-scrollbar{display:none;}
.products-slider .product-card{min-width:240px;scroll-snap-align:start;}

.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;max-width:1360px;margin:0 auto;padding:0 24px;align-items:center;}
.about-icon{width:56px;height:56px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--amber),var(--amber-dark));display:flex;align-items:center;justify-content:center;color:#0f172a;box-shadow:var(--shadow-amber);margin-bottom:22px;}
.about-right{padding:20px;}
.about-left h2{font-family:var(--font-display);font-size:clamp(1.8rem,3.2vw,2.5rem);font-weight:700;color:var(--slate-900);margin-bottom:18px;letter-spacing:-.01em;}
.about-left p{color:var(--slate-600);font-size:16px;line-height:1.75;}
.help-card{background:#ffffff;border-radius:var(--r-2xl);padding:38px;box-shadow:var(--shadow-md);}
.help-card h3{font-family:var(--font-display);font-size:21px;font-weight:700;color:var(--slate-900);margin-bottom:26px;}
.step{display:flex;gap:16px;margin-bottom:22px;}
.step:last-of-type{margin-bottom:30px;}
.step-number{width:38px;height:38px;border-radius:50%;background:var(--amber-light);color:var(--amber-dark);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-content h4{font-size:15.5px;font-weight:700;color:var(--slate-900);margin-bottom:3px;}
.step-content p{font-size:13.5px;color:var(--slate-500);line-height:1.5;}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;max-width:1360px;margin:0 auto;padding:0 24px;}
.stat-card{background:#ffffff;border-radius:var(--r-xl);padding:32px 20px;text-align:center;box-shadow:var(--shadow-sm);transition:transform 250ms var(--ease),box-shadow 250ms var(--ease);border:1px solid rgba(226,232,240,.85);}
.stat-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-md);}
.stat-number{font-family:var(--font-display);font-size:clamp(2rem,3.4vw,2.7rem);font-weight:700;color:var(--amber);letter-spacing:-.01em;}
.stat-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--slate-500);margin-top:8px;}

.trust-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;max-width:1360px;margin:0 auto;padding:0 24px;}
.trust-badge{display:flex;align-items:center;gap:12px;background:var(--slate-100);padding:16px 24px;border-radius:var(--r-lg);}
.trust-icon{color:var(--amber);flex-shrink:0;}
.trust-badge span{font-weight:700;font-size:14.5px;color:var(--slate-700);}

.scroll-top-btn{position:fixed;bottom:100px;right:24px;width:48px;height:48px;border-radius:50%;background:var(--slate-900);color:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(15,23,42,.25);z-index:800;opacity:0;visibility:hidden;transform:translateY(12px);transition:all 300ms var(--ease);}
.scroll-top-btn.visible{opacity:1;visibility:visible;transform:translateY(0);}
.scroll-top-btn:hover{background:var(--amber);color:#0f172a;transform:translateY(-4px);box-shadow:0 12px 32px rgba(245,158,11,.4);}
@media (max-width:768px){.scroll-top-btn{bottom:90px;right:16px;width:42px;height:42px;}}

.footer{background:var(--slate-900);color:var(--slate-300);padding:80px 0 0;border-top:1px solid rgba(245,158,11,.3);}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.1fr;gap:48px;max-width:1360px;margin:0 auto;padding:0 24px 56px;}
.footer-logo{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.footer-logo .logo-text{color:#ffffff;}
.footer-col p{font-size:14.5px;line-height:1.7;color:var(--slate-400);max-width:300px;}
.footer-col h5{color:#ffffff;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:20px;padding-bottom:12px;position:relative;}
.footer-col h5::after{content:'';position:absolute;left:0;bottom:0;width:28px;height:2px;background:var(--amber);}
.footer-col ul li{margin-bottom:13px;}
.footer-col a{font-size:14.5px;color:var(--slate-400);transition:color 200ms var(--ease);}
.footer-col a:hover{color:var(--amber);}
.footer-contact-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;font-size:14.5px;color:var(--slate-400);}
.footer-contact-item svg{flex-shrink:0;margin-top:2px;color:var(--amber);}
.footer-bottom{border-top:1px solid var(--slate-800);padding:24px;text-align:center;font-size:13px;color:var(--slate-500);display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;}

.admin-page{position:fixed;inset:0;z-index:2100;background:
  radial-gradient(1200px 400px at 85% -10%,rgba(245,158,11,.10),transparent 60%),
  radial-gradient(900px 380px at -10% 0%,rgba(59,130,246,.08),transparent 55%),
  linear-gradient(165deg,#f6f8fb,#ffffff 45%,#faf7f2);overflow-y:auto;display:none}
.admin-page.active{display:block;animation:fadeSlideIn 300ms var(--ease)}
.admin-page-inner{max-width:1160px;margin:0 auto;padding:24px 24px 80px}
.admin-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(226,232,240,.7);border-radius:18px;padding:14px 18px;box-shadow:0 6px 24px rgba(15,23,42,.06)}
.admin-topbar-left{display:flex;align-items:center;gap:14px}
.admin-back-btn{width:40px;height:40px;border-radius:12px;background:#ffffff;border:1.5px solid var(--slate-200);display:flex;align-items:center;justify-content:center;color:var(--slate-600);transition:all 200ms var(--ease);flex-shrink:0;font-size:18px;font-weight:700}
.admin-back-btn:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-light)}
.admin-topbar-left h2{font-size:20px;font-weight:900;color:var(--slate-900);background:linear-gradient(120deg,#0f172a,#334155);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.admin-topbar-left p{font-size:13px;color:var(--slate-500)}
.admin-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#f97316 55%,#dc2626);color:#fff;font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 4px 16px rgba(245,158,11,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.admin-tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--slate-100);border-radius:14px;padding:5px;margin-bottom:22px;overflow-x:auto;scrollbar-width:none;box-shadow:0 2px 10px rgba(15,23,42,.05)}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{flex-shrink:0;padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;color:var(--slate-500);transition:all 250ms var(--ease);text-align:center;white-space:nowrap;position:relative}
.admin-tab:hover{color:var(--slate-900);background:var(--slate-50)}
.admin-tab.active{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;box-shadow:0 4px 14px rgba(245,158,11,.35)}
.admin-panel{display:none;animation:fadeSlide 300ms var(--ease)}
.admin-panel.active{display:block}
.admin-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.admin-stat-card{background:#ffffff;border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform 220ms var(--ease),box-shadow 220ms var(--ease);border:1px solid var(--slate-100)}
.admin-stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--amber))}
