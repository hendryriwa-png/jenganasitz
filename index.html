<style>
:root{--amber:#f59e0b;--amber-dark:#d97706;--amber-light:#fef3c7;--slate-900:#0f172a;--slate-800:#1e293b;--slate-700:#334155;--slate-600:#475569;--slate-500:#64748b;--slate-400:#94a3b8;--slate-300:#cbd5e1;--slate-200:#e2e8f0;--slate-100:#f1f5f9;--slate-50:#f8fafc;--success:#22c55e;--success-light:#dcfce7;--success-dark:#16a34a;--danger:#ef4444;--danger-dark:#dc2626;--danger-light:#fef2f2;--white:#ffffff;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--shadow-sm:0 1px 3px rgba(15,23,42,.08);--shadow-md:0 4px 12px rgba(15,23,42,.1);--shadow-lg:0 8px 24px rgba(15,23,42,.12);--shadow-xl:0 16px 40px rgba(15,23,42,.15);--ease:cubic-bezier(.4,0,.2,1);--pop:cubic-bezier(.34,1.56,.64,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--slate-900);background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:1rem}
ul,ol{list-style:none}
.container{max-width:1280px;margin:0 auto;padding:0 20px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 28px;border-radius:var(--r-md);font-weight:600;font-size:1rem;transition:all 200ms var(--ease);white-space:nowrap}
.btn-primary{background:var(--amber);color:var(--slate-900);box-shadow:0 4px 14px rgba(245,158,11,.35)}
.btn-primary:hover{background:var(--amber-dark);transform:translateY(-2px);box-shadow:0 8px 20px rgba(245,158,11,.4)}
.btn-outline{border:2px solid var(--slate-200);color:var(--slate-700);background:var(--white)}
.btn-outline:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-light)}
.btn-danger{background:var(--danger);color:var(--white)}
.btn-danger:hover{background:var(--danger-dark)}
.btn-ghost{color:var(--slate-600);background:transparent}
.btn-ghost:hover{color:var(--amber);background:var(--amber-light)}
.btn-block{width:100%}
.btn-sm{padding:10px 20px;font-size:.875rem;border-radius:var(--r-sm)}
.btn-lg{padding:16px 32px;font-size:1.125rem;border-radius:var(--r-lg)}
.input-group{display:flex;flex-direction:column;gap:6px}
.input-group label{font-size:.875rem;font-weight:600;color:var(--slate-700)}
.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px 16px;border:2px solid var(--slate-200);border-radius:var(--r-md);font-size:1rem;color:var(--slate-900);background:var(--white);transition:border-color 200ms var(--ease),box-shadow 200ms var(--ease)}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
.input-group input::placeholder{color:var(--slate-400)}
.input-group .input-row{display:flex;gap:12px}
.input-group .input-row > *{flex:1}
.card{background:var(--white);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);border:1px solid var(--slate-100);overflow:hidden;transition:transform 300ms var(--ease),box-shadow 300ms var(--ease)}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.product-card{padding:16px;display:flex;flex-direction:column;height:100%}
.product-image{aspect-ratio:1/1;background:var(--slate-50);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px}
.product-image img{width:100%;height:100%;object-fit:cover;transition:transform 300ms var(--ease)}
.product-card:hover .product-image img{transform:scale(1.05)}
.product-body{flex:1;display:flex;flex-direction:column}
.product-category{margin-bottom:8px}
.product-name{font-size:1rem;font-weight:600;color:var(--slate-900);margin-bottom:8px;line-height:1.3}
.product-meta{display:flex;gap:12px;font-size:.75rem;color:var(--slate-500);margin-bottom:8px}
.product-rating{display:flex;align-items:center;gap:4px;font-size:.875rem;color:var(--amber);margin-bottom:12px}
.product-footer{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--slate-100)}
.product-price{font-size:1.125rem;font-weight:700;color:var(--amber-dark)}
.product-price .unit{font-size:.75rem;font-weight:500;color:var(--slate-400);margin-left:4px}
.vendor-card{padding:16px}
.vendor-header{display:flex;gap:12px;margin-bottom:12px}
.vendor-avatar{width:48px;height:48px;border-radius:var(--r-lg);background:var(--amber-light);color:var(--amber-dark);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.vendor-meta{display:flex;flex-direction:column;gap:4px}
.vendor-location{font-size:.875rem;color:var(--slate-500)}
.vendor-stats{display:flex;gap:12px;margin:12px 0;padding:12px 0;border-top:1px solid var(--slate-100);border-bottom:1px solid var(--slate-100)}
.vendor-stats .stat{flex:1;text-align:center}
.vendor-stats .stat-value{font-size:1.125rem;font-weight:700;color:var(--slate-900)}
.vendor-stats .stat-label{font-size:.7rem;font-weight:600;color:var(--slate-500);text-transform:uppercase}
.category-card{padding:20px;text-align:center}
.category-icon{font-size:2.5rem;margin-bottom:12px}
.category-card h3{font-size:1.125rem;font-weight:700;color:var(--slate-900);margin-bottom:8px}
.step-card{padding:24px;text-align:center}
.step-icon{font-size:2rem;color:var(--amber);margin-bottom:12px}
.step-card h3{font-size:1.125rem;font-weight:700;color:var(--slate-900);margin-bottom:8px}
.step-card p{color:var(--slate-600);font-size:.875rem;line-height:1.6}
.role-card{padding:16px;border:2px solid var(--slate-200);border-radius:var(--r-lg);background:var(--white);cursor:pointer;transition:all 200ms var(--ease)}
.role-card:hover{border-color:var(--amber);background:var(--amber-light)}
.role-card.selected{border-color:var(--amber);background:var(--amber-light);box-shadow:0 0 0 3px var(--amber-light)}
.role-card .rc-check{width:24px;height:24px;border-radius:50%;background:var(--amber);color:var(--slate-900);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;margin-bottom:8px;margin-left:auto}
.role-icon{font-size:1.5rem;margin-bottom:8px}
.role-card h4{font-size:1rem;font-weight:700;color:var(--slate-900);margin-bottom:4px}
.role-card .rc-label{font-size:.75rem;color:var(--slate-500)}
.vtype-card{padding:16px;border:2px solid var(--slate-200);border-radius:var(--r-lg);background:var(--white);cursor:pointer;transition:all 200ms var(--ease);text-align:center}
.vtype-card:hover{border-color:var(--amber);background:var(--amber-light)}
.vtype-card.selected{border-color:var(--amber);background:var(--amber-light);box-shadow:0 0 0 3px var(--amber-light)}
.vtype-icon{font-size:2rem;margin-bottom:8px}
.vtype-card h4{font-size:1rem;font-weight:700;color:var(--slate-900);margin-bottom:4px}
.vtype-tag{font-size:.75rem;color:var(--slate-500);margin-bottom:8px}
.vtype-features{list-style:none;padding:0;margin:0;font-size:.7rem;color:var(--slate-500)}
.vtype-features li{margin:4px 0}
.vtype-features .vr-ok{color:var(--success);margin-right:6px}
.cta-card{background:var(--slate-900);color:var(--white);border-radius:var(--r-xl);padding:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.cta-content{text-align:center;max-width:400px}
.cta-card h2{font-size:1.75rem;font-weight:800;color:var(--white);margin-bottom:12px}
.cta-card p{color:var(--slate-300);font-size:1rem;line-height:1.6}
.cta-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cta-image{flex:1;min-width:300px}
.cta-image-wrapper{border-radius:var(--r-xl);overflow:hidden}
.cta-image img{width:100%;height:100%;object-fit:cover}
.hero-floating-card{position:absolute;background:var(--white);padding:16px;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:200px}
.hero-floating-card svg{width:48px;height:48px;color:var(--amber);margin-bottom:12px}
.hero-floating-card strong{display:block;color:var(--slate-900);margin-bottom:4px}
.hero-floating-card small{color:var(--slate-500);font-size:.75rem}
.hero-floating-card.card-2{top:20%;right:-10%}
.hero-floating-card.card-3{bottom:20%;left:-10%}
</head>

function sha256Hex(str) {
  const encoder = new TextEncoder();
  const data = encoder.encode(str);
  return crypto.subtle.digest('SHA-256', data).then(buffer => {
    return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  });
}

async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(password));
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function hashPasswordV2(password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', new Uint8Array([...salt, ...data]));
  const hash = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  return 'v2$' + Array.from(salt).map(b => b.toString(16).padStart(2, '0')).join('') + '$' + hash;
}

async function checkPwMatch(stored, raw) {
  if (stored.startsWith('v2$')) {
    const parts = stored.split('$');
    if (parts.length !== 3) return false;
    const salt = new Uint8Array(parts[1].match(/.{2}/g).map(b => parseInt(b, 16)));
    const encoder = new TextEncoder();
    const data = encoder.encode(raw);
    const hashBuffer = await crypto.subtle.digest('SHA-256', new Uint8Array([...salt, ...data]));
    const hash = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    return hash === parts[2];
  }
  const legacy = await hashPassword(raw);
  return stored === legacy || stored === raw;
}

// ============ PASSWORD STRENGTH ============
function updatePasswordStrength(input, fillId, textId) {
  const val = input.value;
  const fill = document.getElementById(fillId);
  const text = document.getElementById(textId);
  if (!fill || !text) return;
  
  let strength = 0;
  if (val.length >= 8) strength++;
  if (/[A-Z]/.test(val)) strength++;
  if (/[a-z]/.test(val)) strength++;
  if (/[0-9]/.test(val)) strength++;
  if (/[^A-Za-z0-9]/.test(val)) strength++;
  
  const pct = (strength / 5) * 100;
  fill.style.width = pct + '%';
  
  const colors = ['var(--danger)', 'var(--danger)', 'var(--amber)', 'var(--success)', 'var(--success-dark)'];
  const texts = ['Very weak', 'Weak', 'Fair', 'Strong', 'Very strong'];
  fill.style.background = colors[strength] || 'var(--danger)';
  text.textContent = texts[strength] || 'Very weak';
}

document.addEventListener('input', (e) => {

// ============ CART ============
function addToCart(product, quantity = 1) {
  const existing = cart.find(item => item.id === product.id);
  if (existing) {
    existing.quantity += quantity;
  } else {
    cart.push({...product, quantity});
  }
  updateCartUI();
  showToast(`${product.name} added to cart`, 'success');
  openCart();
}

function removeFromCart(productId) {
  cart = cart.filter(item => item.id !== productId);
  updateCartUI();
}

function updateCartQuantity(productId, quantity) {
  const item = cart.find(item => item.id === productId);
  if (item) {
    item.quantity = Math.max(1, quantity);
    updateCartUI();
  }
}

function updateCartUI() {
  const count = cart.reduce((sum, item) => sum + item.quantity, 0);
  const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotalAmount').textContent = formatPrice(total);
  
  const empty = document.getElementById('cartEmpty');
  const items = document.getElementById('cartItems');
  const footer = document.getElementById('cartFooter');
  
  if (cart.length === 0) {
    empty.style.display = 'block';
    items.style.display = 'none';
    footer.style.display = 'none';
  } else {
    empty.style.display = 'none';
    items.style.display = 'block';
    footer.style.display = 'block';
    items.innerHTML = cart.map(item => `
      <div class="cart-item">
        <img src="${item.image}" alt="${item.name}">
        <div class="cart-item-info">
          <h4>${item.name}</h4>
          <p class="cart-item-vendor">${item.vendor}</p>
          <p class="cart-item-price">${formatPrice(item.price)} × ${item.quantity}</p>
        </div>
        <div class="cart-item-qty">
          <button onclick="updateCartQuantity('${item.id}', ${item.quantity - 1})">-</button>
          <span>${item.quantity}</span>
          <button onclick="updateCartQuantity('${item.id}', ${item.quantity + 1})">+</button>
        </div>
        <button class="cart-item-remove" onclick="removeFromCart('${item.id}')">&times;</button>
      </div>
    `).join('');
  }
}

function renderProducts() {
  const grid = document.getElementById('productsGrid');
  if (!grid) return;
  
  let filtered = [...allProducts];
  if (currentSort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
  else if (currentSort === 'price-desc') filtered.sort((a, b) => b.price - a.price);
  else if (currentSort === 'rating') filtered.sort((a, b) => b.rating - a.rating);
  else if (currentSort === 'newest') filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  
  grid.innerHTML = filtered.map(p => `
    <article class="card product-card" role="listitem" onclick="viewProduct('${p.id}')">
      <div class="product-image"><img src="${p.image}" alt="${p.name}" loading="lazy" width="400" height="300"></div>
      <div class="product-body">
        <div class="product-category"><span class="badge badge-info">${p.category}</span></div>
        <h3 class="product-name">${p.name}</h3>
        <div class="product-meta">
          <span class="product-vendor">🏪 ${p.vendor}</span>
          <span class="product-location">📍 ${p.vendorRegion}</span>
        </div>
        <div class="product-rating">
          <span class="rating">★ ${p.rating}</span>
          <span class="reviews">(${p.reviews} reviews)</span>
        </div>
        <div class="product-footer">
          <span class="product-price">${formatPrice(p.price)} <span class="unit">/${p.unit}</span></span>

// ============ AUTH HANDLERS ============
async function handleSignIn(e) {
  e.preventDefault();
  const form = e.target;
  const email = form.email.value.trim().toLowerCase();
  const password = form.password.value;
  if (!email || !password) { showToast('Please fill in all fields', 'danger'); return; }
  showLoading('Signing in...');
  try {
    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
    const session = data.session;
    const user = data.user;
    if (session) sessionStorage.setItem('sb_session', JSON.stringify(session));
    const profile = await getUserProfile(user.id);
    if (profile) {
      currentUser = { name: profile.name, email: user.email, role: profile.role, vendorEmail: profile.role === 'vendor' ? user.email : null };
    } else {
      currentUser = { name: user.user_metadata?.name || user.email.split('@')[0], email: user.email, role: user.app_metadata?.role || 'customer', vendorEmail: user.app_metadata?.role === 'vendor' ? user.email : null };
    }
    closeModal('authModal');
    saveSession(currentUser);
    updateAuthUI();
    form.reset();
    showToast('Welcome back, ' + currentUser.name.split(' ')[0] + '!');
    if (currentUser.role === 'vendor') { openVendorDashboard(); }
    else if (currentUser.role === 'customer') { openCustomerDashboard(); }
    else { const last = getLastSection(); if (last !== 'home') navigateToSection(last); }
    renderProducts();
    renderCategoryChips();
    initPush();
  } catch (e) { showToast(e.message || 'An error occurred', 'danger'); } finally { hideLoading(); }
}

async function handleCustomerRegister(e) {
  e.preventDefault();
  const form = e.target;
  const email = form.email.value.trim().toLowerCase();
  const password = form.password.value;
  const name = form.name.value.trim();
  const phone = form.phone.value.trim();
  if (!email || !password || !name || !phone) { showToast('Please fill in all fields', 'danger'); return; }
  if (!form.agreeTerms?.checked) { showToast('You must agree to the Terms & Conditions', 'danger'); return; }
  showLoading('Creating account...');
  try {
    if (demoMode) {
      if (findDemoUser(email)) { showToast('Email already registered', 'danger'); return; }
      const hashedPw = await hashPasswordV2(password);
      const user = { email, password: hashedPw, name, role: 'customer', phone, createdAt: new Date().toISOString() };
      addDemoUser(user);
      currentUser = { name, email, role: 'customer' };
    } else {
      const { data: authData, error: authError } = await _supabase.auth.signUp({ email, password, options: { data: { name, role: 'customer', phone, nationalId: form.nationalId?.value?.trim(), tin: form.tin?.value?.trim(), paymentAccount: form.paymentAccount?.value?.trim() } } });
      if (authError) throw new Error(authError.message);
      if (authData.session) sessionStorage.setItem('sb_session', JSON.stringify(authData.session));
      const userId = authData.user.id;
      const customerData = { id: userId, email, name, role: 'customer', phone, nationalId: form.nationalId?.value?.trim(), tin: form.tin?.value?.trim(), paymentAccount: form.paymentAccount?.value?.trim() };
      const { error: profileError } = await _supabase.from('customers').insert(customerData);
      if (profileError) console.warn('Profile creation failed:', profileError.message);
      currentUser = { name, email, role: 'customer' };
    }
    closeModal('authModal');
    saveSession(currentUser);
    updateAuthUI();
    form.reset();
    regDocData = {};
    vendorUploadedImage = null;
    resetVendorTypePicker();
    resetCustomerTypePicker();
    document.querySelectorAll('[id^=reg][id$=Preview]').forEach(img => img.style.display = 'none');
    showToast('Welcome, ' + currentUser.name.split(' ')[0] + '!');
    openCustomerDashboard();
    renderProducts();
    renderCategoryChips();
    initPush();
  } catch (e) { showToast(e.message || 'An error occurred', 'danger'); } finally { hideLoading(); }
}

async function handleVendorRegister(e) {
  e.preventDefault();
  const form = e.target;
  const email = form.email.value.trim().toLowerCase();
  const password = form.password.value;
  const name = form.name.value.trim();
  const phone = form.phone.value.trim();
  if (!email || !password || !name || !phone) { showToast('Please fill in all fields', 'danger'); return; }
  const agreeEl = form.agreeTerms;
  if (!agreeEl || !agreeEl.checked) { showToast('You must agree to the Terms & Conditions', 'danger'); return; }
  const storeName = form.storeName.value.trim() || name;
  showLoading('Creating account...');
  try {
    if (demoMode) {
      if (findDemoUser(email)) { showToast('Email already registered', 'danger'); return; }
      const hashedPw = await hashPasswordV2(password);
      const user = { email, password: await hashPasswordV2(password), name, role: 'vendor', storeName, phone, createdAt: new Date().toISOString() };
      addDemoUser(user);
      currentUser = { name: storeName, email, role: 'vendor', vendorEmail: email };
    } else {
      const { data: authData, error: authError } = await _supabase.auth.signUp({ email, password, options: { data: { name, role: 'vendor', storeName, phone, brela: form.brela?.value?.trim() || null, licence: form.licence?.value?.trim() || null, nationalId: form.vendorNationalId?.value?.trim() || null, tin: form.vendorTin?.value?.trim() || null, bankAccount: form.vendorBank?.value?.trim() || null, photo: vendorUploadedImage || null, region: form.vendorRegion?.value?.trim() || null, lat: form.vendorLat?.value ? parseFloat(form.vendorLat.value) || null : null, lng: form.vendorLng?.value ? parseFloat(form.vendorLng.value) || null : null } } });
      if (authError) throw new Error(authError.message);
      if (authData.session) sessionStorage.setItem('sb_session', JSON.stringify(authData.session));
      const userId = authData.user.id;
      const vendorData = { id: userId, email, name, role: 'vendor', storeName, phone, brela: form.brela?.value?.trim() || null, licence: form.licence?.value?.trim() || null, nationalId: form.vendorNationalId?.value?.trim() || null, tin: form.vendorTin?.value?.trim() || null, bankAccount: form.vendorBank?.value?.trim() || null, photo: vendorUploadedImage || null, region: form.vendorRegion?.value?.trim() || null, lat: form.vendorLat?.value ? parseFloat(form.vendorLat.value) || null : null, lng: form.vendorLng?.value ? parseFloat(form.vendorLng.value) || null : null };
      const { error: profileError } = await _supabase.from('vendors').insert(vendorData);
      if (profileError) { await _supabase.auth.admin.deleteUser(authData.user.id); throw new Error(profileError.message); }
      currentUser = { name: storeName, email, role: 'vendor', vendorEmail: email };
    }
    closeModal('authModal');
    saveSession(currentUser);
    updateAuthUI();
    form.reset();
    regDocData = {};
    vendorUploadedImage = null;
    resetVendorTypePicker();
    resetCustomerTypePicker();
    document.querySelectorAll('[id^=reg][id$=Preview]').forEach(img => img.style.display = 'none');
    showToast('Welcome, ' + currentUser.name.split(' ')[0] + '!');
    openVendorDashboard();
    renderProducts();
    renderCategoryChips();
    initPush();
  } catch (e) { showToast(e.message || 'An error occurred', 'danger'); } finally { hideLoading(); }
}

async function handleForgotPassword(e) {
  e.preventDefault();
  const form = e.target;
  const email = form.email.value.trim().toLowerCase();
  if (!email) { showToast('Please enter your email', 'danger'); return; }
  showLoading('Sending reset link...');
  try {
    const { error } = await _supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname + '#reset-password' });
    if (error) throw error;
    showToast('If this email exists, a password reset link has been sent.', 'success');
    closeModal('forgotPasswordModal');
  } catch (err) {
    showToast('Failed to send reset link: ' + err.message, 'danger');
  } finally { hideLoading(); }
}

async function handleResetPassword(e) {
  e.preventDefault();
  const form = e.target;
  const password = form.password.value;
  const confirm = form.confirm.value;
  if (!password || !confirm) { showToast('Please fill in all fields', 'danger'); return; }
  if (password !== confirm) { showToast('Passwords do not match', 'danger'); return; }
  if (password.length < 6) { showToast('Password must be at least 6 characters', 'danger'); return; }
  showLoading('Updating password...');
  try {
    const { error } = await _supabase.auth.updateUser({ password: password });
    if (error) throw error;
    const email = form.dataset.email;
    if (email) {
      const hashed = await hashPasswordV2(password);
      if (customerAccounts.some(c => c.email === email)) {
        await sbUpdate('customers', { email }, { password: hashed });
      } else if (vendorAccounts.some(v => v.email === email)) {
        await sbUpdate('vendors', { email }, { password: hashed });
      }
    }
    showToast('Password updated successfully! Please sign in with your new password.', 'success');
    closeModal('resetPasswordModal');
    openModal('authModal');
    switchAuthTab('signin');
  } catch (err) {
    showToast('Failed to update password: ' + err.message, 'danger');
  } finally { hideLoading(); }
}

  else header.classList.remove('scrolled');
});

// ============ SMOOTH SCROLL ============
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
  anchor.addEventListener('click', function(e) {
    const targetId = this.getAttribute('href');
    if (targetId === '#') return;
    e.preventDefault();
    const target = document.querySelector(targetId);
    if (target) {
      target.scrollIntoView({behavior: 'smooth', block: 'start'});
      history.pushState(null, '', targetId);
    }
  });
});
