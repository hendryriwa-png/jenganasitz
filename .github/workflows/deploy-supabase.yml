name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy vendor-dashboard --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy place-order --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy sign-in --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy notify-login --project-ref "$SUPABASE_PROJECT_REF"
